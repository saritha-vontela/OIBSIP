<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #d9f7e5, #dceaff);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px #00000018;
    }

    h1 {
      text-align: center;
      color: #176b45;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #bbb;
      font-size: 16px;
    }

    button {
      margin-top: 22px;
      background: #176b45;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #105236;
    }

    #result {
      margin-top: 20px;
      padding: 14px;
      background: #e8f8ef;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #message {
      color: #b42318;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌡️ Temperature Converter</h1>
    <p>Convert temperatures easily</p>

    <label for="temperature">Enter Temperature</label>
    <input type="number" id="temperature"
           placeholder="Enter a value" step="any">

    <label for="fromUnit">Convert From</label>
    <select id="fromUnit">
      <option value="C">Celsius (°C)</option>
      <option value="F">Fahrenheit (°F)</option>
      <option value="K">Kelvin (K)</option>
    </select>

    <label for="toUnit">Convert To</label>
    <select id="toUnit">
      <option value="F">Fahrenheit (°F)</option>
      <option value="C">Celsius (°C)</option>
      <option value="K">Kelvin (K)</option>
    </select>

    <button onclick="convertTemperature()">Convert</button>

    <div id="result" aria-live="polite">
      Your result will appear here
    </div>
    <div id="message" role="alert"></div>
  </div>

  <script>
    function convertTemperature() {
      const input = document.getElementById("temperature");
      const from = document.getElementById("fromUnit").value;
      const to = document.getElementById("toUnit").value;
      const result = document.getElementById("result");
      const message = document.getElementById("message");

      message.textContent = "";
      result.textContent = "Your result will appear here";

      if (input.value.trim() === "") {
        message.textContent = "Please enter a temperature.";
        return;
      }

      const value = Number(input.value);
      if (!Number.isFinite(value)) {
        message.textContent = "Please enter a valid number.";
        return;
      }

      // Convert the input to Celsius first.
      let celsius;

      if (from === "C") {
        celsius = value;
      } else if (from === "F") {
        celsius = (value - 32) * 5 / 9;
      } else {
        celsius = value - 273.15;
      }

      // Reject temperatures below absolute zero.
      if (celsius < -273.15 - 1e-10) {
        message.textContent =
          "Temperature cannot be below absolute zero.";
        return;
      }

      let converted;

      if (to === "C") {
        converted = celsius;
      } else if (to === "F") {
        converted = celsius * 9 / 5 + 32;
      } else {
        converted = celsius + 273.15;
      }

      const units = {
        C: "°C",
        F: "°F",
        K: "K"
      };

      result.textContent =
        `${value} ${units[from]} = ${converted.toFixed(2)} ${units[to]}`;
    }
  </script>
</body>
</html>
